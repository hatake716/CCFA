name: Play Release Bundle

# Google Play へアップロードする「署名済み Android App Bundle (.aab)」を生成する。
# GitHub Release 向けの debug APK を作る publish-release.yml とは別物。
#
# 必要な GitHub secrets（Settings → Secrets and variables → Actions）:
#   CCFA_UPLOAD_KEYSTORE_BASE64 : アップロード鍵の .jks を base64 化した文字列
#     生成: openssl base64 -A -in upload-keystore.jks
#   CCFA_UPLOAD_STORE_PASSWORD  : キーストアのパスワード
#   CCFA_UPLOAD_KEY_ALIAS       : 鍵のエイリアス（例: ccfa-upload）
#   CCFA_UPLOAD_KEY_PASSWORD    : 鍵のパスワード
#
# secrets が未設定のときは署名なしの .aab を生成し、構成確認だけできる。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ビルド対象のタグ（省略時は現在のブランチ HEAD）"
        required: false

permissions:
  contents: read

jobs:
  bundle:
    if: github.repository == 'hatake716/CCFA'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android SDK 36 is installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install runtime packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils dpkg patchelf binutils file unzip

      - name: Prepare Android PRoot runtime
        run: bash scripts/prepare-termux-android-proot.sh

      - name: Prepare distribution licenses and corresponding source
        run: bash scripts/prepare-distribution-legal.sh

      - name: Decode upload keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CCFA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "path=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"
            echo "Upload keystore decoded."
          else
            echo "No upload keystore secret set — building an UNSIGNED bundle."
          fi

      - name: Build release App Bundle (.aab)
        env:
          CCFA_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.path }}
          CCFA_UPLOAD_STORE_PASSWORD: ${{ secrets.CCFA_UPLOAD_STORE_PASSWORD }}
          CCFA_UPLOAD_KEY_ALIAS: ${{ secrets.CCFA_UPLOAD_KEY_ALIAS }}
          CCFA_UPLOAD_KEY_PASSWORD: ${{ secrets.CCFA_UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Locate and checksum the AAB
        id: aab
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          sha256sum "$AAB" | tee "$AAB.sha256"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      # 16KB ページサイズは Play の必須要件（targetSdk 35+ かつネイティブ .so 同梱時）。
      # 同梱 .so がすべて 16KB(2**14) アラインかを確認する。未整合なら公開がブロックされる。
      - name: Verify bundled .so are 16 KB page aligned
        run: |
          set -e
          READELF="$(command -v llvm-readelf || true)"
          if [ -z "$READELF" ]; then
            READELF="$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$READELF" ]; then
            echo "::warning::llvm-readelf が見つからないため 16KB アラインの自動検証をスキップしました。docs/PLAY-RELEASE.md の手順で手動確認してください。"
            exit 0
          fi
          fail=0
          for so in app/src/main/jniLibs/arm64-v8a/*.so; do
            aligns="$("$READELF" -l "$so" | awk '/LOAD/ {print $NF}')"
            for a in $aligns; do
              case "$a" in
                0x4000|0x10000) : ;;  # 16KB もしくはそれ以上
                2**14|2**16) : ;;
                *) echo "::error::$so の LOAD セグメント align=$a は 16KB 未満です（NDK r28+ で再ビルドが必要）"; fail=1 ;;
              esac
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::16KB ページサイズ要件を満たさない .so があります。Play へのアップロードはブロックされます。"
            exit 1
          fi
          echo "All bundled .so are 16 KB page aligned."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccfa-play-release-aab
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
